<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  :root {
    --ink: #17181C;
    --muted: #6B6F76;
    --faint: #9A9EA6;
    --line: rgba(0,0,0,.09);
    --surface: #fff;
    --sunk: #FAFAFA;
    --marker: #FFD24A;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #ECEDEF;
      --muted: #9DA1A9;
      --faint: #71757D;
      --line: rgba(255,255,255,.10);
      --surface: #1E1F24;
      --sunk: #232429;
      --marker: rgba(255,210,74,.30);
    }
  }
  * { box-sizing: border-box; }
  body {
    width: 340px;
    margin: 0;
    background: var(--surface);
    color: var(--ink);
    font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }

  section { padding: 12px 14px; border-bottom: 1px solid var(--line); }
  section:last-of-type { border-bottom: 0; }

  label.field { display: block; }
  .label {
    display: block;
    font: 600 10.5px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--faint);
    margin-bottom: 7px;
  }

  textarea, select {
    width: 100%;
    font-family: inherit;
    font-size: 13px;
    color: var(--ink);
    background: var(--sunk);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 8px 9px;
  }
  textarea { resize: vertical; min-height: 58px; }
  select { cursor: pointer; -webkit-appearance: none; appearance: none;
           background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%),
                             linear-gradient(135deg, var(--muted) 50%, transparent 50%);
           background-position: calc(100% - 15px) 50%, calc(100% - 10px) 50%;
           background-size: 5px 5px, 5px 5px;
           background-repeat: no-repeat;
           padding-right: 26px; }
  textarea:focus, select:focus { outline: 2px solid var(--ink); outline-offset: 1px; border-color: transparent; }

  .row { display: flex; gap: 7px; align-items: center; margin-top: 10px; }
  .row .field { flex: 1; min-width: 0; }
  .row #go { flex: 1; }

  button.go {
    font: 600 12.5px/1 inherit;
    color: #17181C;
    background: #FFD24A;
    border: 1px solid transparent;
    border-radius: 9px;
    padding: 11px 15px;
    cursor: pointer;
    white-space: nowrap;
    box-shadow: 0 1px 2px rgba(0,0,0,.14), inset 0 1px 0 rgba(255,255,255,.5);
    transition: transform .13s ease, box-shadow .16s ease, filter .16s ease,
                color .16s ease, border-color .16s ease, background .16s ease;
  }
  button.go:hover {
    filter: brightness(.96);
    transform: translateY(-1px);
    box-shadow: 0 5px 13px rgba(216,168,20,.42), inset 0 1px 0 rgba(255,255,255,.5);
  }
  button.go:active {
    transform: translateY(0) scale(.975);
    box-shadow: 0 1px 2px rgba(0,0,0,.14);
  }
  button.go:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  button.go:disabled { opacity: .45; cursor: default; transform: none; box-shadow: none; filter: none; }

  /* Secondary action: same shape, no fill, so the primary keeps its weight. */
  button.go.ghost {
    background: transparent;
    color: var(--muted);
    border-color: var(--line);
    box-shadow: none;
  }
  button.go.ghost:hover {
    color: var(--ink);
    background: var(--sunk);
    border-color: var(--muted);
    filter: none;
    box-shadow: none;
    transform: translateY(-1px);
  }
  button.go.ghost:active { transform: translateY(0) scale(.975); }

  @media (prefers-reduced-motion: reduce) {
    button.go, button.go.ghost { transition: none; }
    button.go:hover, button.go:active,
    button.go.ghost:hover, button.go.ghost:active { transform: none; }
  }

  input[type=text] {
    width: 100%;
    font: 12px/1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color: var(--ink);
    background: var(--sunk);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 9px;
  }
  input[type=text]:focus { outline: 2px solid var(--ink); outline-offset: 1px; border-color: transparent; }

  .foot-note {
    margin: 9px 0 0;
    font-size: 11px;
    line-height: 1.5;
    color: var(--faint);
  }
  .foot-note a { color: var(--muted); }
  .foot-note code {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 10.5px;
  }

  .issue-line { display: block; margin-top: 8px; font-size: 12px; line-height: 1.5; }
  .issue-line .was {
    text-decoration: line-through;
    text-decoration-color: #C23A32;
    color: var(--muted);
  }
  .issue-line .now { background: linear-gradient(var(--marker), var(--marker)) no-repeat 0 86% / 100% 44%; }
  .issue-line .why { display: block; color: var(--faint); font-size: 11px; }

  .out {
    margin-top: 10px;
    font-size: 14px;
    line-height: 1.55;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    max-height: 130px;
    overflow-y: auto;
  }
  .out:empty { display: none; }
  .out .hit {
    background: linear-gradient(var(--marker), var(--marker)) no-repeat 0 86% / 100% 44%;
  }
  .out .bad { color: #C23A32; font-size: 13px; }

  .toggle {
    display: flex; align-items: flex-start; gap: 9px;
    cursor: pointer;
    margin-top: 11px;
  }
  .toggle:first-child { margin-top: 0; }
  .toggle input { margin: 2px 0 0; accent-color: var(--ink); flex: 0 0 auto; }
  .toggle b { display: block; font-weight: 550; }
  .toggle small { color: var(--muted); font-size: 11.5px; line-height: 1.45; display: block; }

  footer {
    padding: 10px 14px 12px;
    display: flex; justify-content: space-between; align-items: center;
    border-top: 1px solid var(--line);
    background: var(--sunk);
  }
  .kbd {
    font: 10.5px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: var(--faint);
  }
  a.link {
    font-size: 11.5px;
    color: var(--muted);
    text-decoration: none;
    border-bottom: 1px solid var(--line);
    cursor: pointer;
  }
  a.link:hover { color: var(--ink); }

  .sheet-dot {
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    margin-right: 4px;
    vertical-align: middle;
    background: var(--faint);
  }

  .settings {
    border-top: 1px solid var(--line);
  }
  .settings-toggle {
    display: block;
    padding: 8px 14px;
    font: 600 10.5px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--faint);
    cursor: pointer;
    list-style: none;
  }
  .settings-toggle::-webkit-details-marker { display: none; }
  .settings-toggle::before { content: "▸ "; }
  .settings[open] > .settings-toggle::before { content: "▾ "; }
  .settings[open] > .settings-toggle { border-bottom: 1px solid var(--line); }
  .settings-inner {
    max-height: 200px;
    overflow-y: auto;
    padding: 8px 14px;
  }
  .settings-inner .field { margin-top: 8px; }
  .settings-inner .field:first-child { margin-top: 0; }
  .settings-inner .row { margin-top: 8px; }
</style>
</head>
<body>
  <section>
    <label class="field">
      <textarea id="input" rows="2" placeholder="Type or paste text here"></textarea>
    </label>
    <div class="row">
      <label class="field">
        <select id="target"></select>
      </label>
      <button class="go" id="go">Translate</button>
      <button class="go ghost" id="checkBtn">Check</button>
    </div>
    <div class="row">
      <label class="field">
        <select id="saveType">
          <option value="vocab">Word</option>
          <option value="collocation">Collocation</option>
          <option value="slang">Slang</option>
          <option value="sentence">Sentence</option>
        </select>
      </label>
      <input type="text" id="saveVi" placeholder="Vietnamese (auto)" style="flex:1;min-width:0;font:12px/1 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--ink);background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:9px">
      <button class="go ghost" id="saveBtn">Save</button>
    </div>
    <div class="out" id="out"></div>
  </section>

  <details class="settings">
    <summary class="settings-toggle">Settings</summary>
    <div class="settings-inner">
      <label class="field">
        <span class="label"><span id="sheetStatus" class="sheet-dot"></span>Sheet URL</span>
        <input type="text" id="sheetUrl" placeholder="Apps Script /exec URL">
      </label>
      <label class="field">
        <input type="text" id="sheetKey" placeholder="Save key (optional)">
      </label>
      <div class="row">
        <button class="go ghost" id="testBtn">Test</button>
      </div>
      <label class="toggle">
        <input type="checkbox" id="auto">
        <span><b>Auto-translate on select</b></span>
      </label>
      <label class="field">
        <span class="label">Provider</span>
        <select id="provider">
          <option value="google">Google</option>
          <option value="mymemory">MyMemory</option>
        </select>
      </label>
      <label class="field">
        <span class="label">Grammar language</span>
        <select id="checkLang"></select>
      </label>
      <label class="field">
        <input type="text" id="ltServer" placeholder="LanguageTool server (optional)">
      </label>
    </div>
  </details>

  <footer>
    <span class="kbd" id="kbd">Alt+T translate</span>
    <a class="link" id="shortcuts">Shortcuts</a>
    <a class="link" id="openSidePanel">Side panel</a>
  </footer>

  <script src="languages.js"></script>
  <script src="popup.js"></script>
</body>
</html>
